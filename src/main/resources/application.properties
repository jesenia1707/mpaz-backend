
spring.application.name=mpaz-backend

# CONEXION SUPABASE POSTGRESQL
spring.datasource.url=jdbc:postgresql://aws-1-us-east-1.pooler.supabase.com:5432/postgres?sslmode=require
spring.datasource.username=postgres.knwrkyvtotsbsjjixxre
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# SERVIDOR
server.port=8080

# SUPABASE STORAGE
supabase.url=${SUPABASE_URL}
supabase.storage.bucket=${SUPABASE_STORAGE_BUCKET}
supabase.storage.key=${SUPABASE_SERVICE_ROLE_KEY}

# TAMANO MAXIMO DE ARCHIVOS
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB
